<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Tengo shows how long your money lasts until the next money. A demo with fictional data." />
    <!-- Link preview in chat apps and social sites. %SITE_URL% is filled at build (vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tengo" />
    <meta property="og:title" content="Tengo: money you can plan around" />
    <meta property="og:description" content="See how long your money lasts until the next money. A demo with fictional data." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Tengo logo and the words Money you can plan around." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B0C" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAFA" />
    <meta name="color-scheme" content="dark light" />
    <!-- Sets the theme before first paint, so the wrong theme never flashes. -->
    <script src="/theme-init.js"></script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Tengo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
