<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tengo is offline</title>
    <style>
      :root { --bg: #fafafa; --ink: #171717; --muted: #525252; --line: #e5e5e5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #171717; --ink: #fafafa; --muted: #b0b0b0; --line: #404040; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 28rem; padding: 2rem 1rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { color: var(--muted); margin: 0 0 1.5rem; }
      a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 1.25rem; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Tengo could not load this page without a connection. Pages you have opened before work offline. Your data stays on this device.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
