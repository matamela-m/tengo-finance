# Runs on every push and pull request. The accuracy regression test (src/engine/accuracy.test.ts)
# is part of `npm test` and fails the build if headline forecast metrics get worse than stated thresholds.
name: CI

on:
  push:
  pull_request:

jobs:
  secrets:
    # Fails if a key or token is committed, such as a Supabase service role key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rls:
    # Row-level security tests: user B cannot read, change or delete user A's data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql)/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test-rls.sh

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run fonts:check
      - run: npm test
      - run: npm run build
      - run: npm run budget
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
